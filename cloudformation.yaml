AWSTemplateFormatVersion: 2010-09-09

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket name where the code is stored

  VpcId:
    Type: String
    Description: VPC ID for the SageMaker domain

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of subnet IDs for the SageMaker domain

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-data-bucket-${AWS::AccountId}

  ReadWriteDataBucketPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt DataBucket.Arn
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub ${DataBucket.Arn}/*

  DataPipelineFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref ReadWriteDataBucketPolicy

  FetchDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: fetch_data_function.zip
      Role: !GetAtt DataPipelineFunctionRole.Arn
      Handler: solar_predictor.handlers.fetch_data.lambda_handler
      Runtime: python3.14
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AWS::StackName
      EmptyOnDelete: true

  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
        - !Ref ReadWriteDataBucketPolicy

  SageMakerDomain:
    Type: AWS::SageMaker::Domain
    Properties:
      DomainName: !Sub ${AWS::StackName}-domain
      AuthMode: IAM
      VpcId: !Ref VpcId
      SubnetIds: !Ref SubnetIds
      DefaultUserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        JupyterLabAppSettings:
          AppLifecycleManagement:
            IdleSettings:
              LifecycleManagement: ENABLED
              IdleTimeoutInMinutes: 60

  SageMakerUserProfile:
    Type: AWS::SageMaker::UserProfile
    Properties:
      DomainId: !Ref SageMakerDomain
      UserProfileName: !Sub ${AWS::StackName}-domain-user

Outputs:
  DataBucketName:
    Description: DATA_BUCKET
    Value: !Ref DataBucket
  FetchDataFunctionName:
    Description: FETCH_DATA_FUNCTION_NAME
    Value: !Ref FetchDataFunction
  EcrRegistry:
    Description: ECR_REGISTRY
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
  ImageRepoUri:
    Description: IMAGE_REPO_URI
    Value: !GetAtt ImageRepository.RepositoryUri
  SageMakerRoleArn:
    Description: SAGEMAKER_ROLE_ARN
    Value: !GetAtt SageMakerExecutionRole.Arn
  SageMakerDomainId:
    Description: SAGEMAKER_DOMAIN_ID
    Value: !Ref SageMakerDomain
