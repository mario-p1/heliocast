AWSTemplateFormatVersion: 2010-09-09

Parameters:
  ImageUri:
    Type: String
    Description: URI of the container image for the model

  ExecutionRoleArn:
    Type: String
    Description: ARN of the SageMaker execution role

  MlflowTrackingUri:
    Type: String
    Description: URI of the mlflow app

  ModelUri:
    Type: String
    Description: URI of the mlflow model (e.g. models:/SARAH3-predictor/3)

Resources:
  Sarah3PredictorModel:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !Ref ExecutionRoleArn
      PrimaryContainer:
        Image: !Ref ImageUri
        Environment:
          MLFLOW_TRACKING_URI: !Ref MlflowTrackingUri
          SERVED_MODEL_URI: !Ref ModelUri
  
  Sarah3PredictorEndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: AllTraffic
          ModelName: !GetAtt Sarah3PredictorModel.ModelName
          ServerlessConfig:
            MaxConcurrency: 1
            MemorySizeInMB: 1024
            ProvisionedConcurrency: 1

  Sarah3PredictorEndpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointConfigName: !GetAtt Sarah3PredictorEndpointConfig.EndpointConfigName

Outputs:
  Sarah3PredictorEndpointUrl:
    Description: SARAH3_PREDICTOR_ENDPOINT_NAME
    Value: !GetAtt Sarah3PredictorEndpoint.EndpointName