[project]
name = "solar-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.120",
    "botocore[crt]>=1.43.120",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[tool.uv]
default-groups = ["dev", "ml"]

[dependency-groups]
dev = ["notebook>=7.6.3", "pytest>=9.2.0", "ruff>=0.17.3"]
ml = [
    "mlflow>=3.17.2",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
    "typer>=0.27.3",
    "plotly>=7.1.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
